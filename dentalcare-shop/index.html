
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#ffffff">
  <script>
    var savedTheme;
    try { savedTheme = localStorage.getItem('theme'); } catch (_) {}
    var initialTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = initialTheme;
    document.documentElement.style.colorScheme = initialTheme;
  </script>
  <title>DentalCare — Dental clinic &amp; care shop</title>

  <meta
    name="description"
    content="DentalCare: dental clinic, online booking and a shop of dental care products. EN / RU / KY."
  >

</head>

<body>
  <div id="root"><div class="startup-loader" role="status"><b>DentalCare</b><span class="spinner" aria-hidden="true"></span><span>Loading…</span></div></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
